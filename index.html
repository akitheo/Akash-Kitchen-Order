<!DOCTYPE html>
<html>
<head>
  <title>Akash's Kitchen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; margin: 20px; background:#f9f9f9; }
    h1, h2 { text-align: center; }
    .menu-section { margin-bottom: 20px; }
    .menu-item { margin: 8px 0; }
    button { padding: 6px 12px; margin-left: 10px; cursor:pointer; }
    #cart, #receipt { border-top: 2px solid #ccc; padding: 15px; margin-top: 20px; background:#fff; border-radius:8px;}
    #download-pdf { display:none; margin: 15px auto; padding:8px 16px; cursor:pointer; }
    table { width:100%; border-collapse: collapse; margin-top:10px;}
    th, td { border:1px solid #333; padding:5px; text-align:left;}
  </style>
</head>

<body>

<h1>🍛 Akash's Kitchen</h1>

<!-- MENU -->
<div class="menu-section">
  <h2>Combo Menu</h2>
  <div id="combo-menu"></div>
</div>

<div class="menu-section">
  <h2>Individual Items</h2>
  <div id="individual-menu"></div>
</div>

<div class="menu-section">
  <h2>Drinks</h2>
  <div id="drinks-menu"></div>
</div>

<!-- CART -->
<div id="cart">
  <h2>🛒 Cart</h2>
  <div id="cart-items">No items added yet.</div>
  <div id="cart-total"></div>
  <button onclick="placeOrder()">Place Order</button>
</div>

<!-- RECEIPT -->
<div id="receipt" style="display:none;">
  <h2>🧾 Order Receipt</h2>
  <p><strong>Order ID:</strong> <span id="r-order-id"></span></p>
  <p><strong>Name:</strong> <span id="r-name"></span></p>
  <p><strong>Mobile:</strong> <span id="r-mobile"></span></p>
  <div id="r-items"></div>
  <h3>Total: <span id="r-total"></span> NTD</h3>
  <p style="color:green;"><strong>Please show this receipt at the cashier to pay.</strong></p>
</div>

<!-- PDF Download Button -->
<button id="download-pdf" onclick="downloadPDF()">Download PDF</button>

<!-- jsPDF Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
/* MENU DATA */
const menu = {
  combo: [
    { id: "C001", name: "Rice + 2 Veg + Chicken", price: 150 },
    { id: "C002", name: "Roti + 2 Veg + Chicken (3 pcs)", price: 150 }
  ],
  individual: [
    { id: "I001", name: "Roti (per piece)", price: 10 },
    { id: "I002", name: "Rice (1 cup)", price: 15 },
    { id: "I003", name: "Chicken Curry Bengali Home Style (1 plate, 4 pcs)", price: 200 },
    { id: "I004", name: "Mutton Curry Bengali Home Style (1 plate, 6 pcs)", price: 350 }
  ],
  drinks: [
    { id: "D001", name: "Indian Welcome Drink (Lemon + Salt + Sugar)", price: 40 },
    { id: "D002", name: "Coca Cola", price: 25 }
  ]
};

let cart = [];

/* DISPLAY MENU */
function displayMenu(sectionId, items) {
  const div = document.getElementById(sectionId);
  items.forEach(item => {
    const d = document.createElement("div");
    d.className = "menu-item";
    d.innerHTML = `<strong>${item.name}</strong> - ${item.price} NTD
      <button onclick="addToCart('${item.id}')">Add</button>`;
    div.appendChild(d);
  });
}

displayMenu("combo-menu", menu.combo);
displayMenu("individual-menu", menu.individual);
displayMenu("drinks-menu", menu.drinks);

/* ADD TO CART */
function addToCart(itemId) {
  const item = [...menu.combo, ...menu.individual, ...menu.drinks].find(i => i.id === itemId);
  const existing = cart.find(i => i.id === itemId);
  if (existing) existing.qty++;
  else cart.push({ ...item, qty: 1 });
  displayCart();
}

/* DISPLAY CART */
function displayCart() {
  const itemsDiv = document.getElementById("cart-items");
  const totalDiv = document.getElementById("cart-total");
  if (cart.length === 0) {
    itemsDiv.innerHTML = "No items added yet.";
    totalDiv.innerHTML = "";
    return;
  }

  let total = 0;
  itemsDiv.innerHTML = "";
  cart.forEach(i => {
    total += i.qty * i.price;
    itemsDiv.innerHTML += `${i.name} x${i.qty} = ${i.qty * i.price} NTD<br>`;
  });
  totalDiv.innerHTML = `<strong>Total: ${total} NTD</strong>`;
}

/* PLACE ORDER */
function placeOrder() {
  if (cart.length === 0) return alert("Cart is empty!");
  const name = prompt("Enter your name:");
  const mobile = prompt("Enter your mobile number:");
  if (!name || !mobile) return alert("Details required");

  const orderId = "ORD" + Date.now();
  const order = { order_id: orderId, customer_name: name, mobile: mobile, items: cart };

  // PUSH ORDER TO GOOGLE SHEET
  fetch("https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec", {
    method: "POST",
    body: JSON.stringify(order)
  })
  .then(() => {
    showReceipt(orderId, name, mobile, cart);
    cart = [];
    displayCart();
  })
  .catch(() => alert("Order failed"));
}

/* SHOW RECEIPT */
function showReceipt(orderId, name, mobile, items) {
  document.getElementById("receipt").style.display = "block";
  document.getElementById("r-order-id").innerText = orderId;
  document.getElementById("r-name").innerText = name;
  document.getElementById("r-mobile").innerText = mobile;

  const itemsDiv = document.getElementById("r-items");
  let total = 0;
  let tableHTML = `<table>
    <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;
  
  items.forEach(i => {
    const t = i.qty * i.price;
    total += t;
    tableHTML += `<tr>
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.price}</td>
      <td>${t}</td>
    </tr>`;
  });
  tableHTML += "</table>";
  itemsDiv.innerHTML = tableHTML;

  document.getElementById("r-total").innerText = total;

  // SHOW DOWNLOAD BUTTON AFTER ORDER
  document.getElementById("download-pdf").style.display = "block";
}

/* DOWNLOAD PDF */
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const orderId = document.getElementById("r-order-id").innerText;
  const name = document.getElementById("r-name").innerText;
  const mobile = document.getElementById("r-mobile").innerText;
  const total = document.getElementById("r-total").innerText;
  const date = new Date().toLocaleString();

  let y = 15;

  // LOGO as Base64
  const imgBase64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAAAQCAYAAAB+Wn6qAAAACXBIWXMAAAsTAAALEwEAmpwYAAABJ0lEQVR4nO2WTQrCMAxFJwM/+fR2QmD7zTkGZt0kIocCKGRJx0r+tfpNIG53YNM7Z/cy5iyr+RRVYI8B1MAsVtR6Vh8eRjSgwgOpY8e1fX2LTPMJ+oLCApBJC30fAViY4TTMoqkGkT5OmCZt8+QbIdV7K1IgYJcC6TQnSA0TjXlBCg4WQQGJGf3B2z0MV8sPQ3w/GB5pFyD9U6zEKwWACf9M8f1bAyJQZwJHo9HyKZxTDZw78gKPM48qK6V2MMnG3K2L4wHnvbqIY28Vx3S0KpJ0Edt+S9vONhBdcphLqssDvwU7/w8XQpYqJ6f7H5vymrFAAAAAElFTkSuQmCC";
  doc.addImage(imgBase64, "PNG", 85, y, 40, 20);
  y += 30;

  // HEADER
  doc.setFontSize(18);
  doc.setTextColor(180, 60, 40);
  doc.text("Akash's Kitchen", 105, y, null, null, "center");
  y += 8;

  doc.setFontSize(11);
  doc.setTextColor(0, 0, 0);
  doc.text("Thanks for coming today!", 105, y, null, null, "center");
  y += 5;
  doc.text("Hope you will enjoy your food.", 105, y, null, null, "center");
  y += 5;
  doc.text("Visit again", 105, y, null, null, "center");
  y += 10;

  // LINE
  doc.setDrawColor(200);
  doc.line(10, y, 200, y);
  y += 8;

  // ORDER INFO
  doc.setFontSize(11);
  doc.text(`Date & Time: ${date}`, 10, y);
  y += 6;
  doc.text(`Order ID: ${orderId}`, 10, y);
  y += 6;
  doc.text(`Customer Name: ${name}`, 10, y);
  y += 6;
  doc.text(`Mobile: ${mobile}`, 10, y);
  y += 10;

  // ITEMS TABLE
  const tableData = Array.from(
    document.querySelectorAll("#r-items table tr")
  ).slice(1).map(row =>
    Array.from(row.cells).map(cell => cell.innerText)
  );

  doc.autoTable({
    startY: y,
    head: [['Item', 'Qty', 'Price (NTD)', 'Total (NTD)']],
    body: tableData,
    theme: 'striped',
    headStyles: { fillColor: [180, 60, 40], textColor: 255, halign: 'center' },
    bodyStyles: { halign: 'left' },
    alternateRowStyles: { fillColor: [245, 245, 245] },
    styles: { fontSize: 10 }
  });

  y = doc.lastAutoTable.finalY + 10;

  // TOTAL & SIGNATURE
  doc.setFontSize(14);
  doc.setTextColor(0, 120, 0);
  doc.text(`Grand Total: ${total} NTD`, 10, y);

  doc.setFontSize(10);
  doc.setTextColor(80);
  doc.text("Signature: Akash Pal", 180, y + 10, null, null, "right");

  y += 20;
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text("Please show this receipt at the cashier to pay.", 105, y, null, null, "center");

  doc.save(`AkashKitchen_${orderId}.pdf`);
}
</script>

</body>
</html>
