<!DOCTYPE html>
<html>
<head>
  <title>Akash's Kitchen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body { font-family: Arial; margin:20px; background:#f4f4f4; }
    h1, h2 { text-align:center; color:#b23a2f; }
    .menu-section, #cart, #receipt {
      background:#fff; padding:15px; margin-bottom:20px; border-radius:8px;
    }
    .menu-item {
      display:flex; justify-content:space-between; margin:8px 0;
    }
    button {
      background:#b23a2f; color:#fff; border:none;
      padding:6px 12px; border-radius:4px; cursor:pointer;
    }
    #download-pdf { display:none; margin:15px auto; padding:10px 20px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #333; padding:6px; }
    th { background:#b23a2f; color:white; }
  </style>
</head>

<body>

<h1>🍛 Akash's Kitchen</h1>

<!-- MENU -->
<div class="menu-section">
  <h2>Combo Menu</h2>
  <div id="combo-menu"></div>
</div>

<div class="menu-section">
  <h2>Individual Items</h2>
  <div id="individual-menu"></div>
</div>

<div class="menu-section">
  <h2>Drinks</h2>
  <div id="drinks-menu"></div>
</div>

<!-- CART -->
<div id="cart">
  <h2>🛒 Cart</h2>
  <div id="cart-items">No items added yet.</div>
  <div id="cart-total"></div><br>
  <button onclick="placeOrder()">Place Order</button>
</div>

<!-- RECEIPT -->
<div id="receipt" style="display:none;">
  <h2>🧾 Order Receipt</h2>
  <p><b>Order ID:</b> <span id="r-order-id"></span></p>
  <p><b>Name:</b> <span id="r-name"></span></p>
  <p><b>Mobile:</b> <span id="r-mobile"></span></p>
  <div id="r-items"></div>
  <h3>Total: <span id="r-total"></span> NTD</h3>
  <p style="color:green"><b>Please show this receipt at the cashier.</b></p>
</div>

<button id="download-pdf" onclick="downloadPDF()">⬇ Download Receipt PDF</button>

<!-- LIBRARIES -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
/* 🔹 FULL MENU (UNCHANGED) */
const menu = {
  combo: [
    { id:"C001", name:"Rice + 2 Veg + Chicken", price:150 },
    { id:"C002", name:"Roti + 2 Veg + Chicken (3 pcs)", price:150 }
  ],
  individual: [
    { id:"I001", name:"Roti (per piece)", price:10 },
    { id:"I002", name:"Rice (1 cup)", price:15 },
    { id:"I003", name:"Chicken Curry Bengali Home Style (1 plate, 4 pcs)", price:200 },
    { id:"I004", name:"Mutton Curry Bengali Home Style (1 plate, 6 pcs)", price:350 }
  ],
  drinks: [
    { id:"D001", name:"Indian Welcome Drink (Lemon + Salt + Sugar)", price:40 },
    { id:"D002", name:"Coca Cola", price:25 }
  ]
};

let cart = [];
const API_URL = "https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec";

/* DISPLAY MENU */
function displayMenu(id, items) {
  const div = document.getElementById(id);
  items.forEach(i => {
    div.innerHTML += `
      <div class="menu-item">
        <span>${i.name} - ${i.price} NTD</span>
        <button onclick="addToCart('${i.id}')">Add</button>
      </div>`;
  });
}
displayMenu("combo-menu", menu.combo);
displayMenu("individual-menu", menu.individual);
displayMenu("drinks-menu", menu.drinks);

/* CART */
function addToCart(id) {
  const item = [...menu.combo, ...menu.individual, ...menu.drinks].find(i=>i.id===id);
  const ex = cart.find(i=>i.id===id);
  ex ? ex.qty++ : cart.push({...item, qty:1});
  renderCart();
}
function renderCart() {
  let html="", total=0;
  cart.forEach(i=>{
    total+=i.qty*i.price;
    html+=`${i.name} x${i.qty} = ${i.qty*i.price} NTD<br>`;
  });
  document.getElementById("cart-items").innerHTML = html || "No items added yet.";
  document.getElementById("cart-total").innerHTML = `<b>Total: ${total} NTD</b>`;
}

/* PLACE ORDER → GOOGLE SHEET */
function placeOrder() {
  if (!cart.length) return alert("Cart empty");
  const name = prompt("Name:");
  const mobile = prompt("Mobile:");
  if (!name || !mobile) return;

  const orderId = "ORD" + Date.now();
  const order = {
    order_id: orderId,
    customer_name: name,
    mobile: mobile,
    items: cart
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(order)
  })
  .then(() => {
    showReceipt(orderId, name, mobile, cart);
    cart = [];
    renderCart();
  })
  .catch(() => alert("Order failed"));
}

/* RECEIPT */
function showReceipt(id, name, mobile, items) {
  document.getElementById("receipt").style.display="block";
  document.getElementById("download-pdf").style.display="block";

  document.getElementById("r-order-id").innerText=id;
  document.getElementById("r-name").innerText=name;
  document.getElementById("r-mobile").innerText=mobile;

  let total=0;
  let html=`<table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;
  items.forEach(i=>{
    const t=i.qty*i.price; total+=t;
    html+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price}</td><td>${t}</td></tr>`;
  });
  html+=`</table>`;
  document.getElementById("r-items").innerHTML=html;
  document.getElementById("r-total").innerText=total;
}

/* PDF */
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.setTextColor(178,58,47);
  doc.text("Akash's Kitchen",105,15,null,null,"center");

  doc.setFontSize(11);
  doc.setTextColor(0);
  doc.text("Thanks for coming today!",105,22,null,null,"center");
  doc.text("Hope you enjoy your food. Visit again 🙏",105,28,null,null,"center");

  doc.autoTable({
    startY:35,
    html:"#r-items table",
    theme:"grid",
    headStyles:{ fillColor:[178,58,47] }
  });

  const total = document.getElementById("r-total").innerText;
  doc.text(`Grand Total: ${total} NTD`,10,doc.lastAutoTable.finalY+10);

  doc.save(`AkashKitchen_${document.getElementById("r-order-id").innerText}.pdf`);
}
</script>

</body>
</html>
