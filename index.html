<!DOCTYPE html>
<html>
<head>
  <title>Akash's Kitchen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }

    h1, h2 {
      text-align: center;
      color: #b23a2f;
    }

    .menu-section {
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
    }

    .menu-item {
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 6px 12px;
      cursor: pointer;
      background: #b23a2f;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background: #8f2f26;
    }

    #cart, #receipt {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    #download-pdf {
      display: none;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #333;
      padding: 6px;
      text-align: left;
    }

    th {
      background: #b23a2f;
      color: white;
    }
  </style>
</head>

<body>

<!-- Hidden logo for PDF -->
<img id="logo" src="https://i.imgur.com/8Km9tLL.png" style="display:none;">

<h1>🍛 Akash's Kitchen</h1>

<!-- MENU -->
<div class="menu-section">
  <h2>Combo Menu</h2>
  <div id="combo-menu"></div>
</div>

<div class="menu-section">
  <h2>Individual Items</h2>
  <div id="individual-menu"></div>
</div>

<div class="menu-section">
  <h2>Drinks</h2>
  <div id="drinks-menu"></div>
</div>

<!-- CART -->
<div id="cart">
  <h2>🛒 Cart</h2>
  <div id="cart-items">No items added yet.</div>
  <div id="cart-total"></div>
  <br>
  <button onclick="placeOrder()">Place Order</button>
</div>

<!-- RECEIPT -->
<div id="receipt" style="display:none;">
  <h2>🧾 Order Receipt</h2>
  <p><strong>Order ID:</strong> <span id="r-order-id"></span></p>
  <p><strong>Name:</strong> <span id="r-name"></span></p>
  <p><strong>Mobile:</strong> <span id="r-mobile"></span></p>
  <div id="r-items"></div>
  <h3>Total: <span id="r-total"></span> NTD</h3>
  <p style="color:green;"><strong>Please show this receipt at the cashier to pay.</strong></p>
</div>

<button id="download-pdf" onclick="downloadPDF()">⬇ Download Receipt PDF</button>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
/* MENU DATA */
const menu = {
  combo: [
    { id: "C001", name: "Rice + 2 Veg + Chicken", price: 150 },
    { id: "C002", name: "Roti + 2 Veg + Chicken (3 pcs)", price: 150 }
  ],
  individual: [
    { id: "I001", name: "Roti (per piece)", price: 10 },
    { id: "I002", name: "Rice (1 cup)", price: 15 },
    { id: "I003", name: "Chicken Curry Bengali Home Style (4 pcs)", price: 200 },
    { id: "I004", name: "Mutton Curry Bengali Home Style (6 pcs)", price: 350 }
  ],
  drinks: [
    { id: "D001", name: "Indian Welcome Drink", price: 40 },
    { id: "D002", name: "Coca Cola", price: 25 }
  ]
};

let cart = [];

/* DISPLAY MENU */
function displayMenu(sectionId, items) {
  const div = document.getElementById(sectionId);
  items.forEach(item => {
    const d = document.createElement("div");
    d.className = "menu-item";
    d.innerHTML = `
      <span><strong>${item.name}</strong> - ${item.price} NTD</span>
      <button onclick="addToCart('${item.id}')">Add</button>
    `;
    div.appendChild(d);
  });
}

displayMenu("combo-menu", menu.combo);
displayMenu("individual-menu", menu.individual);
displayMenu("drinks-menu", menu.drinks);

/* ADD TO CART */
function addToCart(id) {
  const item = [...menu.combo, ...menu.individual, ...menu.drinks].find(i => i.id === id);
  const existing = cart.find(i => i.id === id);
  if (existing) existing.qty++;
  else cart.push({ ...item, qty: 1 });
  displayCart();
}

/* DISPLAY CART */
function displayCart() {
  const itemsDiv = document.getElementById("cart-items");
  const totalDiv = document.getElementById("cart-total");

  if (cart.length === 0) {
    itemsDiv.innerText = "No items added yet.";
    totalDiv.innerText = "";
    return;
  }

  let total = 0;
  itemsDiv.innerHTML = "";
  cart.forEach(i => {
    const t = i.qty * i.price;
    total += t;
    itemsDiv.innerHTML += `${i.name} x${i.qty} = ${t} NTD<br>`;
  });

  totalDiv.innerHTML = `<strong>Total: ${total} NTD</strong>`;
}

/* PLACE ORDER */
function placeOrder() {
  if (cart.length === 0) return alert("Cart is empty");

  const name = prompt("Enter your name:");
  const mobile = prompt("Enter your mobile number:");
  if (!name || !mobile) return alert("Details required");

  const orderId = "ORD" + Date.now();

  fetch("https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec", {
    method: "POST",
    body: JSON.stringify({
      order_id: orderId,
      customer_name: name,
      mobile: mobile,
      items: cart
    })
  }).then(() => {
    showReceipt(orderId, name, mobile, cart);
    cart = [];
    displayCart();
  });
}

/* SHOW RECEIPT */
function showReceipt(orderId, name, mobile, items) {
  document.getElementById("receipt").style.display = "block";
  document.getElementById("download-pdf").style.display = "block";

  document.getElementById("r-order-id").innerText = orderId;
  document.getElementById("r-name").innerText = name;
  document.getElementById("r-mobile").innerText = mobile;

  let total = 0;
  let html = `<table>
    <tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>`;

  items.forEach(i => {
    const t = i.qty * i.price;
    total += t;
    html += `<tr>
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.price}</td>
      <td>${t}</td>
    </tr>`;
  });

  html += "</table>";
  document.getElementById("r-items").innerHTML = html;
  document.getElementById("r-total").innerText = total;
}

/* DOWNLOAD PDF */
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 15;

  const img = document.getElementById("logo");
  doc.addImage(img, "PNG", 85, y, 40, 20);
  y += 30;

  doc.setFontSize(18);
  doc.setTextColor(178, 58, 47);
  doc.text("Akash's Kitchen", 105, y, null, null, "center");

  y += 8;
  doc.setFontSize(11);
  doc.setTextColor(0);
  doc.text("Thanks for coming today!", 105, y, null, null, "center");
  y += 5;
  doc.text("Hope you will enjoy your food. Visit again 🙏", 105, y, null, null, "center");

  y += 12;
  doc.autoTable({
    startY: y,
    html: "#r-items table",
    theme: "grid",
    headStyles: { fillColor: [178, 58, 47] }
  });

  y = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(14);
  doc.text(`Grand Total: ${document.getElementById("r-total").innerText} NTD`, 10, y);

  doc.save(`AkashKitchen_${document.getElementById("r-order-id").innerText}.pdf`);
}
</script>

</body>
</html>
