<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🍽️ Akash's Kitchen – Admin Orders</title>
  <style>
    body { font-family: Arial; margin: 20px; background:#f8f8f8; }
    h1 { text-align: center; }
    .order {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
      border-radius: 8px;
    }
    .note {
      background:#fff3cd;
      border-left:5px solid #f39c12;
      padding:8px;
      margin-top:8px;
    }
    table { width:100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border:1px solid #333; padding:5px; text-align:left; }
    button {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    .preparing { background: orange; }
    .ready { background: green; }
    .paid { background: blue; }
  </style>
</head>
<body>

<h1>🍽️ Akash's Kitchen – Orders</h1>
<div id="orders">Loading...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec";

async function loadOrders() {
  const res = await fetch(API_URL);
  const orders = await res.json();
  const div = document.getElementById("orders");
  div.innerHTML = "";

  if (!orders.length) {
    div.innerHTML = "<p>No orders yet.</p>";
    return;
  }

  orders.forEach(o => {
    const orderId = o.order_id || o.orderId;
    const name = o.customer_name || o.name;
    const items = o.items || [];
    const total = o.total || o.total_amount || 0;
    const note = o.special_note || o.specialNote || "";
    const status = o.status || "";

    // Build items table HTML
    let itemsHTML = "<table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>";
    items.forEach(i => {
      const t = i.qty * i.price;
      itemsHTML += `<tr>
        <td>${i.name}</td>
        <td>${i.qty}</td>
        <td>${i.price}</td>
        <td>${t}</td>
      </tr>`;
    });
    itemsHTML += "</table>";

    div.innerHTML += `
      <div class="order">
        <p><strong>Order ID:</strong> ${orderId}</p>
        <p><strong>Name:</strong> ${name}</p>
        <div><strong>Items:</strong>${itemsHTML}</div>
        <p><strong>Total:</strong> ${total} NTD</p>

        ${note ? `<div class="note"><strong>📝 Note:</strong> ${note}</div>` : ""}

        <p><strong>Status:</strong> <span id="status-${orderId}">${status}</span></p>

        <button class="preparing" onclick="updateStatus('${orderId}','PREPARING')">PREPARING</button>
        <button class="ready" onclick="updateStatus('${orderId}','READY')">READY</button>
        <button class="paid" onclick="updateStatus('${orderId}','PAID')">PAID</button>
      </div>
    `;
  });
}

async function updateStatus(orderId, status) {
  const url = `${API_URL}?action=update&orderId=${orderId}&status=${status}`;
  const res = await fetch(url);
  const result = await res.json();
  if (result.result === "UPDATED") {
    document.getElementById(`status-${orderId}`).innerText = status;
  }
}

loadOrders();
setInterval(loadOrders, 5000);
</script>

</body>
</html>
