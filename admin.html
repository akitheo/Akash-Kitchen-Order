<!DOCTYPE html>
<html>
<head>
  <title>Akash's Kitchen - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; padding: 15px; }
    h1 { text-align: center; }
    .order {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
    button {
      padding: 6px 10px;
      margin: 5px 5px 0 0;
    }
  </style>
</head>

<body>

<h1>🍽️ Akash's Kitchen – Orders</h1>
<div id="orders">Loading...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec";

function loadOrders() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      const div = document.getElementById("orders");
      div.innerHTML = "";

      data.reverse().forEach(o => {
        div.innerHTML += `
          <div class="order">
            <strong>Order ID:</strong> ${o.orderId}<br>
            <strong>Name:</strong> ${o.name}<br>
            <strong>Items:</strong> ${o.items}<br>
            <strong>Total:</strong> ${o.total} NTD<br>
            <strong>Status:</strong> ${o.status}<br>
            <button onclick="updateStatus('${o.orderId}','PREPARING')">PREPARING</button>
            <button onclick="updateStatus('${o.orderId}','READY')">READY</button>
            <button onclick="updateStatus('${o.orderId}','PAID')">PAID</button>
          </div>
        `;
      });
    });
}

function updateStatus(orderId, status) {
  fetch(API_URL + "?orderId=" + orderId + "&newStatus=" + status)
    .then(() => loadOrders());
}

loadOrders();
setInterval(loadOrders, 5000);
</script>

</body>
</html>
