<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🍽️ Akash's Kitchen – Admin Orders</title>
  <style>
    body { font-family: Arial; margin: 20px; background:#f8f8f8; }
    h1 { text-align: center; }
    .order {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
      border-radius: 8px;
    }
    .note {
      background:#fff3cd;
      border-left:5px solid #f39c12;
      padding:8px;
      margin-top:8px;
    }
    button {
      padding: 6px 12px;
      margin-right: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    .preparing { background: orange; }
    .ready { background: green; }
    .paid { background: blue; }
  </style>
</head>
<body>

<h1>🍽️ Akash's Kitchen – Orders</h1>
<div id="orders">Loading...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec";

async function loadOrders() {
  const res = await fetch(API_URL);
  const orders = await res.json();
  const div = document.getElementById("orders");
  div.innerHTML = "";

  if (!orders.length) {
    div.innerHTML = "<p>No orders yet.</p>";
    return;
  }

  orders.forEach(o => {
    div.innerHTML += `
      <div class="order">
        <p><strong>Order ID:</strong> ${o.orderId}</p>
        <p><strong>Name:</strong> ${o.name}</p>
        <p><strong>Items:</strong> ${o.items}</p>
        <p><strong>Total:</strong> ${o.total} NTD</p>

        ${o.special_note ? `<div class="note"><strong>📝 Note:</strong> ${o.special_note}</div>` : ""}

        <p><strong>Status:</strong> <span id="status-${o.orderId}">${o.status}</span></p>

        <button class="preparing" onclick="updateStatus('${o.orderId}','PREPARING')">PREPARING</button>
        <button class="ready" onclick="updateStatus('${o.orderId}','READY')">READY</button>
        <button class="paid" onclick="updateStatus('${o.orderId}','PAID')">PAID</button>
      </div>
    `;
  });
}

async function updateStatus(orderId, status) {
  const url = `${API_URL}?action=update&orderId=${orderId}&status=${status}`;
  const res = await fetch(url);
  const result = await res.json();
  if (result.result === "UPDATED") {
    document.getElementById(`status-${orderId}`).innerText = status;
  }
}

loadOrders();
setInterval(loadOrders, 5000);
</script>

</body>
</html>
