<!DOCTYPE html>
<html>
<head>
  <title>🍽️ Akash's Kitchen – Orders</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .order {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      margin-right: 10px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>

<h1>🍽️ Akash's Kitchen – Orders</h1>
<div id="orders">Loading...</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzFE7xeSXbEmAI9ngofWUDjHhYE9LvSfhDhW1S637vsiALEZmXCZEcLEYLqsUcu3xY9/exec";

/******** FETCH ORDERS ********/
function loadOrders() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      const div = document.getElementById("orders");
      div.innerHTML = "";

      if (data.length === 0) {
        div.innerHTML = "No orders yet.";
        return;
      }

      data.forEach(order => {
        div.innerHTML += `
          <div class="order">
            <strong>Order ID:</strong> ${order.orderId}<br>
            <strong>Name:</strong> ${order.name}<br>
            <strong>Items:</strong> ${order.items}<br>
            <strong>Total:</strong> ${order.total} NTD<br>
            <strong>Status:</strong> ${order.status}<br><br>

            <button onclick="updateStatus('${order.orderId}', 'PREPARING')">
              PREPARING
            </button>

            <button onclick="updateStatus('${order.orderId}', 'PAID')">
              PAID
            </button>

            <button onclick="updateStatus('${order.orderId}', 'READY')">
              READY
            </button>
          </div>
        `;
      });
    })
    .catch(err => {
      document.getElementById("orders").innerHTML = "Error loading orders";
      console.error(err);
    });
}

/******** UPDATE STATUS ********/
function updateStatus(orderId, status) {
  fetch(`${API_URL}?action=update&orderId=${encodeURIComponent(orderId)}&status=${encodeURIComponent(status)}`)
    .then(res => res.json())
    .then(() => {
      loadOrders(); // refresh UI
    })
    .catch(err => {
      alert("Failed to update status");
      console.error(err);
    });
}

loadOrders();
</script>

</body>
</html>
